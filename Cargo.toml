[package]
name = "buddy-rescue"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Standalone inspection and recovery tool for Buddy password vaults"
authors = ["Brand New Byte LLC"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/brandnewbyte/buddy-rescue"
homepage = "https://pwbuddy.com"
readme = "README.md"
publish = false

[dependencies]
buddy-crypto-core = { git = "https://github.com/brandnewbyte/buddy-crypto-core", rev = "fcc6fe4febb55a85538a20aa94ca67bd9daa18fd" }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
percent-encoding = "2.3"
rpassword = "7.3"
rusqlite = { version = "0.30", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
zeroize = "1.8"

[dev-dependencies]

[profile.release]
lto = "thin"
strip = true
